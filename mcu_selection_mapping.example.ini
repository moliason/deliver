# 复制为 mcu_selection_mapping.local.ini，并修改 delivery.local.json 的 selection_mapping。
# 一个系列的代表型号用 / 分隔；系列名中的 x 表示单字符通配。
[seriesParts]
MCU_DEMO=MCU_DEMO001/MCU_DEMO002

# Redmine 项目名与系列名不一致时使用别名。
[projectAlias]
MCU_DEMO=MCU_DEMO

# 默认精确匹配仓库名，只对显式列出的项目启用模糊匹配。
[repoMatch]
fuzzyProjects=

# 多个模块共用一个仓库时声明回退；也支持 [repoFallback.项目名]。
[repoFallback]
USBFS=USB
USBHS=USB
